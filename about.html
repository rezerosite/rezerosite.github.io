<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/fontawesome-all.min.css" />
    <noscript><link rel="stylesheet" href="css/noscript.css" /></noscript>
    <style>
      #header .logo img {
        display: block;
        width: 30%;
        max-width: 50vw;
        height: auto;
        margin: 0 auto 1.5em;
      }

      #nav {
        display: block;
        position: fixed !important;
        top: auto !important;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100vw;
        max-width: none !important;
        margin: 0 !important;
        box-sizing: border-box;
        z-index: 1000;
      }

      #nav ul {
        display: flex;
        width: 100%;
        box-sizing: border-box;
      }

      #nav ul li {
        flex: 1;
        min-width: 0;
        margin: 0;
      }

      #nav ul li a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
        width: 100%;
        box-sizing: border-box;
        padding: 0.5em 0.75em;
        font-size: 0.9em;
        text-align: center;
      }

      @media screen and (max-width: 480px) {
        #nav ul li a {
          min-height: 3.5em;
          height: auto;
          padding: 0.5em 0.25em;
          font-size: 0.75em;
          line-height: 1.2;
        }
      }

      #contact.main.special {
        margin: 2.5rem 0;
      }
    </style>
  </head>
  <body class="is-preload">
    <div id="wrapper">
      <header id="header" class="alt">
        <span class="logo">
          <img
            src="images/Re_Zero_kara_Hajimeru_Isekai_Seikatsu_logo.svg"
            alt="Re:Zero logo"
          />
        </span>
      </header>
      <main id="main">
        <section id="introduction" class="main">
          <header class="major">
            <h2>Who am I?</h2>
          </header>
          <p
            style="
              font-size: 1.5em;
              font-weight: bold;
              font-family: &quot;Courier New&quot;, Courier, monospace;
            "
          >
            My name is Max Rżeżuha. Larp Archbishop representing Reading, The
            Reader.
          </p>
        </section>
        <section id="content" class="main">
          <header class="major">
            <h2>Content</h2>
          </header>
          <p>
            This is placeholder content for the about page. You can replace this
            with your own content.
          </p>
        </section>
        <section id="contact" class="main special">
          <header class="major">
            <h2>Have any questions? Please contact me below!</h2>
          </header>
          <a href="mailto:larperscult@gmail.com" class="button">Email me!</a>
        </section>
      </main>
      <section>
        <nav id="nav">
          <ul>
            <li>
              <a href="girls.html" class="active"
                ><i class="fas fa-female" aria-hidden="true"></i> Girls</a
              >
            </li>
            <li>
              <a href="guide.html" class="active"
                ><i class="fas fa-book" aria-hidden="true"></i> Guide and
                help</a
              >
            </li>
            <li>
              <a href="index.html" class="active"
                ><i class="fas fa-home" aria-hidden="true"></i> Home</a
              >
            </li>
          </ul>
        </nav>
      </section>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.scrollex.min.js"></script>
    <script src="js/jquery.scrolly.min.js"></script>
    <script src="js/browser.min.js"></script>
    <script src="js/breakpoints.min.js"></script>
    <script src="js/util.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
